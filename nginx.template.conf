worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections 4096;
}

http {
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;

    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        root /app;
        index index.php;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        charset utf-8;

        # Every request that doesn't match a real file falls back to
        # index.php — this app is a single front controller (see
        # index.php's own router), same requirement Laravel/Symfony have,
        # just without a framework name for Nixpacks' IS_LARAVEL check to
        # detect automatically.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # No exact-match /robots.txt block here (unlike favicon.ico) — ours
        # is dynamically generated by index.php's router, not a static file,
        # so it must fall through to the location / try_files rule above
        # like every other virtual route, not get short-circuited to a
        # literal (nonexistent) file lookup.
        location = /favicon.ico { access_log off; log_not_found off; }

        # $document_root (not $realpath_root) — explicit and unambiguous,
        # sidesteps a symlink/realpath mismatch between nginx and php-fpm
        # that otherwise produces PHP-FPM's own "File not found." even
        # though nginx's try_files resolved correctly.
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
