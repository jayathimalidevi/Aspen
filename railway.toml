[build]
builder = "nixpacks"

[deploy]
# No startCommand override — nixpacks auto-detects PHP (index.php with no
# composer.json) and serves it, same as this fleet's other PHP sites already
# do successfully on Railway with zero config. Overriding it here risked
# swapping a working multi-worker server for PHP's single-threaded built-in
# one, so it's deliberately left alone.
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
