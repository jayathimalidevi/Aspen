; Picked up automatically by PHP-FPM/CGI SAPIs (not mod_php). Only affects
; directives that are PHP_INI_ALL / PHP_INI_PERDIR scope — opcache.enable
; itself is PHP_INI_SYSTEM and must be turned on at the platform level, but
; nixpacks' PHP images ship it on by default. These are the safe, additive
; wins on top of that.

; Skip the per-request filesystem stat() OPcache normally does to check if
; index.php changed. The app is deployed as an immutable build, so this is
; pure upside — one less disk hit on every single request.
opcache.validate_timestamps=0

; Cache resolved file paths longer than the 120s default so repeated
; __DIR__-relative lookups (style.css, site-config.json, fonts/*, cache/*)
; skip path resolution on hot requests.
realpath_cache_size=4096K
realpath_cache_ttl=600

; Belt-and-suspenders alongside index.php's own ini_set() calls: never leak a
; stack trace / file path to a visitor, log errors instead of discarding them.
; (expose_php is PHP_INI_SYSTEM-scope — not overridable here or in code — so
; it isn't listed; turn it off at the platform php.ini if you control one.)
display_errors=Off
log_errors=On
